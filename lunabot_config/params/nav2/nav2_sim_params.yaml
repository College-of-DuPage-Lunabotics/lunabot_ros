bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /lio_odom
    bt_loop_duration: 20
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0

    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["PurePursuit"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 60.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.14
      stateful: true
    PurePursuit:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 1.0
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.5
      lookahead_time: 2.0
      transform_tolerance: 1.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.5
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 1.0
      cost_scaling_gain: 2.0
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.15
      rotate_to_heading_min_angle: 0.6
      allow_reversing: false
      max_angular_accel: 3.0
      max_angular_velocity: 0.05
      min_turning_radius: 0.8
      max_robot_pose_search_dist: 10.0


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 3.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 50
      height: 50
      footprint: "[ [0.45, 0.41], [0.45, -0.41], [-0.6, -0.41], [-0.6, 0.41] ]"
      footprint_padding: 0.15
      resolution: 0.03
      track_unknown_space: true
      unknown_cost_value: 255
      plugins: ["static_layer", "voxel_layer", "denoise_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        unknown_threshold: 15
        mark_threshold: 0
        observation_sources: pointcloud local_pointcloud
        combination_method: 1
        pointcloud:
          topic: /cloud_obstacles
          max_obstacle_height: 2.0
          min_obstacle_height: 0.10
          obstacle_max_range: 15.0
          obstacle_min_range: 0.2
          raytrace_max_range: 16.0
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
        local_pointcloud:
          topic: /local_obstacles
          max_obstacle_height: 2.0
          min_obstacle_height: 0.15
          obstacle_max_range: 6.0
          obstacle_min_range: 0.2
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 4
        group_connectivity_type: 8
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        footprint_clearing_enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        transform_tolerance: 1.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        footprint_clearing_enabled: true
        inflation_radius: 1.5
        cost_scaling_factor: 3.0
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: true


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 8.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.03
      footprint: "[ [0.45, 0.41], [0.45, -0.41], [-0.6, -0.41], [-0.6, 0.41] ]"
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 2
        observation_sources: pointcloud
        combination_method: 1
        pointcloud:
          topic: /local_obstacles
          max_obstacle_height: 2.0
          min_obstacle_height: 0.15
          obstacle_max_range: 3.0
          obstacle_min_range: 0.2
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6
        footprint_clearing_enabled: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        footprint_clearing_enabled: true
      always_send_full_costmap: true


planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: true

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 1.2
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 100000
      max_planning_time: 3.5
      cost_travel_multiplier: 20.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 5000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10


behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 20.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.15
    min_rotational_vel: 0.02
    rotational_acc_lim: 0.1
